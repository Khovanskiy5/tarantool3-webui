#
# Local development cluster for the Tarantool 3.7 WebUI.
#
# Brings up:
#   * etcd       — single-node, no auth (Task 30 will start populating
#                  cluster config here; M0 keeps it idle).
#   * tt-1/2/3   — three Tarantool instances of the webui-instance image,
#                  one raft-elected replicaset (initial leader tt-1).
#   * haproxy    — single entry point on http://localhost:8080.
#
# All instances share the same cluster YAML (`docker/configs/cluster.yaml`)
# and are selected by INSTANCE_NAME at run time. Persistent state lives
# in named volumes so `make dev-down` removes everything cleanly.
#
# Run from the repo root:
#   docker compose -f docker/docker-compose.dev.yml up --build
#   make dev
#
# Image policy: only official upstream images are used —
#   * quay.io/coreos/etcd       (etcd project's official image)
#   * haproxy:2.9-alpine        (haproxy/dockerhub official)
#   * webui-instance:dev        (this repo, built via docker/Dockerfile.instance)
# No bitnami / community-maintained derivatives.
name: webui-dev

x-tarantool-common: &tarantool-common
  build:
    context: ..
    dockerfile: docker/Dockerfile.instance
  image: webui-instance:dev
  restart: unless-stopped
  environment: &tarantool-env
    # Cluster config visible to every instance. tarantool --name picks
    # the per-instance section out of it.
    TT_CONFIG: /opt/webui/etc/cluster.yaml
    WEBUI_PORT: '8081'
    WEBUI_LOG_LEVEL: debug
    # `webui_peer` password lives in cluster.yaml under
    # credentials.users.webui_peer. The role reads it via
    # `config:get(...)` at start time, so no separate env wiring is
    # needed. TT_WEBUI_PEER_PASSWORD remains a documented escape hatch
    # for installations that ship the secret out-of-band.
    #
    # WebSocket auth (Task 26a) is now wired through the cookie/session
    # check at handshake time. Setting WEBUI_DEV_ANONYMOUS_WS=1 here keeps
    # the legacy anonymous path open for engineers exploring /ws without
    # logging in first. Production compose intentionally omits it.
  volumes:
    - ./configs/cluster.yaml:/opt/webui/etc/cluster.yaml:ro
  healthcheck:
    test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8081/api/health']
    interval: 5s
    timeout: 3s
    retries: 6
    start_period: 30s
  networks:
    - webui-net

services:
  # ── etcd ──────────────────────────────────────────────────────────
  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    restart: unless-stopped
    environment:
      # quay's official etcd image consumes a small set of ETCD_*
      # variables. Single-node, peerless cluster: enough for the local
      # WebUI integration tests that exercise config_store/etcd.
      ETCD_NAME: etcd-0
      ETCD_DATA_DIR: /var/lib/etcd
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd:2379
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd:2380
      ETCD_INITIAL_CLUSTER: etcd-0=http://etcd:2380
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_INITIAL_CLUSTER_TOKEN: webui-dev
      # No auth in dev. Production uses RBAC + mTLS — see Task 11.
      ALLOW_NONE_AUTHENTICATION: 'yes'
    volumes:
      - etcd-data:/var/lib/etcd
    ports:
      - '2379:2379'
    healthcheck:
      test: ['CMD', 'etcdctl', '--endpoints=http://127.0.0.1:2379', 'endpoint', 'health']
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 5s
    networks:
      - webui-net

  # ── tarantool instances ───────────────────────────────────────────
  tt-1:
    <<: *tarantool-common
    container_name: webui-tt-1
    hostname: tt-1
    environment:
      <<: *tarantool-env
      INSTANCE_NAME: tt-1
    volumes:
      - ./configs/cluster.yaml:/opt/webui/etc/cluster.yaml:ro
      - tt-1-data:/opt/webui/var/lib
    ports:
      # Direct access useful for debugging individual instances.
      - '8081:8081'
      - '3301:3301'
    depends_on:
      etcd:
        condition: service_healthy

  tt-2:
    <<: *tarantool-common
    container_name: webui-tt-2
    hostname: tt-2
    environment:
      <<: *tarantool-env
      INSTANCE_NAME: tt-2
    volumes:
      - ./configs/cluster.yaml:/opt/webui/etc/cluster.yaml:ro
      - tt-2-data:/opt/webui/var/lib
    ports:
      - '8082:8081'
      - '3302:3301'
    # All three instances start in parallel. Tarantool's replication
    # bootstrap requires a majority of peers to be reachable at the
    # same moment, so a tt-1 → tt-2 → tt-3 chain via depends_on
    # deadlocks at first boot.
    depends_on:
      etcd:
        condition: service_healthy

  tt-3:
    <<: *tarantool-common
    container_name: webui-tt-3
    hostname: tt-3
    environment:
      <<: *tarantool-env
      INSTANCE_NAME: tt-3
    volumes:
      - ./configs/cluster.yaml:/opt/webui/etc/cluster.yaml:ro
      - tt-3-data:/opt/webui/var/lib
    ports:
      - '8083:8081'
      - '3303:3301'
    depends_on:
      etcd:
        condition: service_healthy

  # ── HAProxy ───────────────────────────────────────────────────────
  haproxy:
    image: haproxy:3.3.4-alpine
    container_name: webui-haproxy
    restart: unless-stopped
    volumes:
      - ./haproxy/haproxy.dev.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      # Single entry point — the URL the docs and tests refer to.
      - '8080:8080'
      # Stats UI; in prod this lives on a private subnet, in dev we
      # expose it so make-dev users can poke around.
      - '8404:8404'
    depends_on:
      tt-1:
        condition: service_healthy
      tt-2:
        condition: service_healthy
      tt-3:
        condition: service_healthy
    healthcheck:
      # HAProxy is healthy if it can answer its own admin socket.
      test: ['CMD-SHELL', "echo 'show info' | socat stdio /var/run/haproxy.sock 2>/dev/null || true"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 2s
    networks:
      - webui-net

# ── network ───────────────────────────────────────────────────────────
networks:
  webui-net:
    driver: bridge
    name: webui-dev-net

# ── persistent data ──────────────────────────────────────────────────
# Per-instance volumes for tarantool work_dir (snap/xlog). `make dev-down`
# removes them via `down --volumes`.
volumes:
  etcd-data:
  tt-1-data:
  tt-2-data:
  tt-3-data:
