#
# HAProxy 2.9 — dev configuration.
#
# Goal: present three Tarantool instances behind a single entry point
# at http://localhost:8080 with realistic balancing, sticky WebSocket
# affinity and the same healthcheck semantics that will be used in
# production (`/api/health` 200 = in rotation, 503 = out of rotation).
#
# Anything specific to TLS, secrets, or external etcd lives in
# haproxy.prod.example.cfg (Task 11).

global
    log stdout format raw local0 info
    maxconn 4096
    # Resolvers entry kept minimal: docker compose DNS resolves the
    # service names tt-1/tt-2/tt-3 from inside the user-defined
    # network without any extra plumbing.

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  forwardfor
    # WebSocket connections sit idle for long stretches. The four
    # timeouts below are calibrated for that — the tunnel timeout is
    # the one that actually applies after Upgrade succeeds.
    timeout connect 5s
    timeout client  1h
    timeout server  1h
    timeout tunnel  1h
    retries 3

# ── runtime stats ────────────────────────────────────────────────────
# Exposed on 8404 inside the compose network. In prod the stats UI is
# placed behind an additional ACL / private subnet (see Task 11).
frontend stats_in
    bind *:8404
    stats enable
    stats uri  /
    stats refresh 5s
    stats show-legends
    stats admin if TRUE

# ── public entry ─────────────────────────────────────────────────────
# Request-Id generation is delegated to the backend middleware
# (backend/webui/http/middleware.lua) which already creates a UUID when
# the X-Request-Id header is missing. HAProxy does not need to
# duplicate that logic. The unique-id below is HAProxy's own per-
# connection identifier, used purely for HAProxy's own access log.
frontend webui_in
    bind *:8080
    unique-id-format %{+X}o\ %ci:%cp_%fi:%fp_%Ts_%rt:%pid
    log-format "%ID %ci -> %s %ST %B %Tr/%Tw/%Tc/%Tt %{+Q}r"

    # Paths whose stickiness matters: WebSocket and the long-running
    # GraphQL endpoint. Static assets stay round-robin so all three
    # caches stay warm.
    acl is_ws       path_beg /ws
    acl is_gql_api  path_beg /admin/api

    default_backend webui_be

# ── backend pool ─────────────────────────────────────────────────────
backend webui_be
    balance roundrobin

    # Cookie SRVID makes the load balancer sticky for the lifetime of
    # the cookie. `insert indirect nocache` keeps the cookie out of
    # cacheable proxies; `prefix` would interfere with WebSocket. We
    # only set the cookie for the routes flagged above — for plain
    # GETs of static assets the cookie does not appear, so every
    # instance serves them and the cache stays warm everywhere.
    cookie SRVID insert indirect nocache postonly attr SameSite=Strict

    # Healthcheck mirrors what /api/health returns:
    #   200 ok or degraded → in rotation (production deliberately keeps
    #     degraded instances serving — see docs/api/rest.md).
    #   503 unhealthy → out of rotation, retried `rise` times.
    option httpchk
    http-check send meth GET uri /api/health
    http-check expect status 200

    # init-addr last,libc,none — keep starting even when DNS for the
    # backend services is not yet resolvable. The compose user-defined
    # network registers tt-1/tt-2/tt-3 once those containers come up,
    # and HAProxy retries through the `resolvers` block below.
    default-server check inter 2s fall 3 rise 2 weight 100 maxconn 200 init-addr last,libc,none resolvers docker_dns

    server tt-1 tt-1:8081 cookie tt-1
    server tt-2 tt-2:8081 cookie tt-2
    server tt-3 tt-3:8081 cookie tt-3

# Docker compose embeds a DNS server on every user-defined network
# at 127.0.0.11. Pointing HAProxy at it lets the balancer pick up
# instance IP changes (e.g. after `docker compose restart tt-2`)
# without requiring HAProxy reloads.
resolvers docker_dns
    nameserver dns 127.0.0.11:53
    resolve_retries       3
    timeout resolve       1s
    timeout retry         1s
    hold other            10s
    hold refused          10s
    hold nx               10s
    hold timeout          10s
    hold valid            10s
    hold obsolete         10s
