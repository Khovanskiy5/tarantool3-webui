#
# HAProxy — three Tarantool instances behind one entry point at
# http://localhost:8080. Round-robin balancing across peers with sticky
# sessions on `webui_session`, healthcheck on `/api/health`
# (200 = in rotation, 503 = out).

global
    log stdout format raw local0 info
    maxconn 4096
    # Resolvers entry kept minimal: docker compose DNS resolves the
    # service names tt-1/tt-2/tt-3 from inside the user-defined
    # network without any extra plumbing.

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  forwardfor
    # WebSocket connections sit idle for long stretches. The four
    # timeouts below are calibrated for that — the tunnel timeout is
    # the one that actually applies after Upgrade succeeds.
    timeout connect 5s
    timeout client  1h
    timeout server  1h
    timeout tunnel  1h
    retries 3

# ── runtime stats ────────────────────────────────────────────────────
# Exposed on 8404 inside the compose network.
frontend stats_in
    bind *:8404
    stats enable
    stats uri  /
    stats refresh 5s
    stats show-legends
    stats admin if TRUE

# ── public entry ─────────────────────────────────────────────────────
# Request-Id generation is delegated to the backend middleware
# (backend/webui/http/middleware.lua) which already creates a UUID when
# the X-Request-Id header is missing. HAProxy does not need to
# duplicate that logic. The unique-id below is HAProxy's own per-
# connection identifier, used purely for HAProxy's own access log.
frontend webui_in
    bind *:8080
    unique-id-format %{+X}o\ %ci:%cp_%fi:%fp_%Ts_%rt:%pid
    log-format "%ID %ci -> %s %ST %B %Tr/%Tw/%Tc/%Tt %{+Q}r"
    default_backend webui_be

# ── backend pool ─────────────────────────────────────────────────────
backend webui_be
    # Distribution policy:
    #   * New / anonymous connections round-robin across all peers.
    #   * Once a user logs in and receives a `webui_session` cookie,
    #     the stick-table pins THAT cookie value to the backend that
    #     served the login. Subsequent requests for the same session
    #     reach the same instance — so cluster.self is stable on the
    #     /cluster page and the (self) marker does not jump.
    #   * Writes from a follower are still forwarded to the leader by
    #     the backend (auth/session.lua, audit/log.lua, …) — affinity
    #     is a UX nicety, not a correctness invariant.
    #   * WebSocket lives in a single TCP tunnel — HAProxy keeps that
    #     tunnel on the backend that answered the Upgrade for
    #     `timeout tunnel` (1h), independent of the cookie.
    balance roundrobin
    stick-table type string len 64 size 16k expire 1h
    stick on req.cook(webui_session) if { req.cook(webui_session) -m found }

    # Healthcheck mirrors what /api/health returns:
    #   200 ok or degraded → in rotation (production deliberately keeps
    #     degraded instances serving — see docs/api/rest.md).
    #   503 unhealthy → out of rotation, retried `rise` times.
    option httpchk
    http-check send meth GET uri /api/health
    http-check expect status 200

    # init-addr last,libc,none — keep starting even when DNS for the
    # backend services is not yet resolvable. The compose user-defined
    # network registers tt-1/tt-2/tt-3 once those containers come up,
    # and HAProxy retries through the `resolvers` block below.
    #
    # Healthcheck cadence:
    #   inter 1s    — probe every second
    #   fall 2      — mark DOWN after 2 consecutive failures (~2s)
    #   rise 2      — mark UP after 2 consecutive successes (~2s),
    #                 hysteresis prevents a single recovered probe
    #                 from steering traffic back into a flapping peer
    #   fastinter / downinter let the up/down transitions probe faster
    #   than the steady-state cadence: a peer that just failed is
    #   probed every 500ms so HAProxy notices its recovery promptly.
    default-server check inter 1s fastinter 500ms downinter 500ms fall 2 rise 2 weight 100 maxconn 200 init-addr last,libc,none resolvers docker_dns

    server tt-1 tt-1:8081
    server tt-2 tt-2:8081
    server tt-3 tt-3:8081

# Docker compose embeds a DNS server on every user-defined network
# at 127.0.0.11. Pointing HAProxy at it lets the balancer pick up
# instance IP changes (e.g. after `docker compose restart tt-2`)
# without requiring HAProxy reloads.
resolvers docker_dns
    nameserver dns 127.0.0.11:53
    resolve_retries       3
    timeout resolve       1s
    timeout retry         1s
    hold other            10s
    hold refused          10s
    hold nx               10s
    hold timeout          10s
    hold valid            10s
    hold obsolete         10s
