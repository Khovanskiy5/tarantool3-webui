roles:
- webui
roles_cfg:
  webui:
    listen: 0.0.0.0:8081
    log_level: debug
    graphiql_enabled: true
    console_enabled: true
    failover:
      agent: true
      keepalive_interval: 1
      watcher_poll_interval_sec: 1
      lease_ttl_sec: 3
      appointment_interval: 1
    # Liveness reporter: each instance publishes a JSON snapshot of
    # its box.info to `<prefix>/state/by-name/<alias>` in etcd, bound
    # to a lease so the key disappears on crash. Surfaced in the
    # Failover UI as "Liveness reports (etcd)" and via the
    # `clusterLiveness` GraphQL query. Defaults are tuned for the
    # 3-second failover budget already used by the agent above
    # (renew every 1s, declare stale after 3s without a renew).
    state_reporter:
      enabled: true
      renew_interval: 1
      keepalive_interval: 3
    etcd_writer:
      endpoints:
      - http://etcd:2379
      prefix: /tarantool/webui
    webhooks:
    - name: dev-loopback
      type: generic
      enabled: true
      url: http://127.0.0.1:1/sink
      events:
      - audit.security
      - issue.appeared
      - config.committed
      - webhook.test
