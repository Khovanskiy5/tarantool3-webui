roles:
- webui
roles_cfg:
  webui:
    listen: 0.0.0.0:8081
    log_level: debug
    graphiql_enabled: true
    console_enabled: true
    failover:
      agent: true
      # Timing model (mirrors Patroni's rule loop_wait + 2*retry_timeout <= ttl):
      #   lease_ttl_sec (ttl)        — lifetime of the coordinator/RW lease
      #   keepalive_interval (loop)  — coordinator cycle / lease renew period
      #   probe_timeout_sec (retry)  — per-etcd-request budget
      # 5 + 2*3 = 11 <= 20, and ttl (20) >= 2*keepalive (10) to arm the
      # watchdog. Values are re-validated and auto-corrected at start.
      lease_ttl_sec: 20
      keepalive_interval: 5
      probe_timeout_sec: 3
      watcher_poll_interval_sec: 1
      appointment_interval: 1
      # Anti-flap (defaults shown; all optional). Suppress leadership
      # ping-pong during restart storms:
      #   phi_threshold: 8          # φ-accrual suspicion to declare dead
      #   phi_min_samples: 3        # heartbeat samples before φ is trusted
      #   phi_min_stddev: 0.5       # σ floor (s) — guards against jumpiness
      #   min_misses: 2             # hard floor: never failover under N misses
      #   dampen_cycles: 3          # consecutive-miss fallback before failover
      #   primary_start_timeout: 10 # grace for a fresh leader to boot
      #   suppress_threshold: 4     # changes/window that freeze promotes
      #   suppress_window: 60
      #   suppress_cooldown: 60
      #   promote_backoff_base: 2   # exp backoff for a stalled candidate
      # Push watch (FO-7): streaming etcd watch for sub-second reaction.
      #   watch_enabled: true       # false → fall back to polling only
      #   watch_idle_timeout: 10    # idle re-check period for the watch fiber
    # Liveness reporter: each instance publishes a JSON snapshot of
    # its box.info to `<prefix>/state/by-name/<alias>` in etcd, bound
    # to a lease so the key disappears on crash. Surfaced in the
    # Failover UI as "Liveness reports (etcd)" and via the
    # `clusterLiveness` GraphQL query. Liveness telemetry is faster
    # than the failover lease on purpose: renew every 1s, declare a
    # peer stale after 3s without a renew.
    state_reporter:
      enabled: true
      renew_interval: 1
      keepalive_interval: 3
    etcd_writer:
      endpoints:
      - http://etcd:2379
      prefix: /tarantool/webui
    webhooks:
    - name: dev-loopback
      type: generic
      enabled: true
      url: http://127.0.0.1:1/sink
      events:
      - audit.security
      - issue.appeared
      - config.committed
      - webhook.test
