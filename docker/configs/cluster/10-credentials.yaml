# Cluster users. `replicator` and `webui_peer` are infra accounts;
# the *_dev users exist only to exercise the role matrix locally.
credentials:
  users:
    replicator:
      password: replicator-dev-password
      roles:
      - replication
    webui_peer:
      password: webui-peer-dev-password
      roles:
      - super
    admin_dev:
      password: admin-dev-password
      roles:
      - public
    operator_dev:
      password: operator-dev-password
      roles:
      - public
    superuser_dev:
      password: superuser-dev-password
      roles:
      - public
    viewer_dev:
      password: viewer-dev-password
      roles:
      - public
