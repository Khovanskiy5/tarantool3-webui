# Three instances in a single replicaset. Each binds 3301 internally;
# advertise URIs use the compose service names which the user-defined
# network resolves to the right container IPs.
#
# No `database.mode` here: with `replication.failover: supervised`
# (see `20-replication.yaml`) the config applier decides RO/RW on
# startup (read-only everywhere except the initial bootstrap leader),
# and the WebUI failover agent assigns read-write during operation by
# owning the synchronous queue. Setting `database.mode` is forbidden
# in supervised mode and would reopen the read-write-on-restart window.
groups:
  default:
    replicasets:
      rs-1:
        instances:
          tt-1:
            iproto:
              listen:
              - uri: 0.0.0.0:3301
              advertise:
                peer:
                  uri: tt-1:3301
          tt-2:
            iproto:
              listen:
              - uri: 0.0.0.0:3301
              advertise:
                peer:
                  uri: tt-2:3301
          tt-3:
            iproto:
              listen:
              - uri: 0.0.0.0:3301
              advertise:
                peer:
                  uri: tt-3:3301
