# Tarantool 3.7 cluster configuration for the local dev compose.
#
# A single YAML file describes all three instances and is mounted into
# every container. The instance to bring up inside a given container is
# selected via `tarantool --name <name>` (the entrypoint passes
# INSTANCE_NAME).
#
# The file is the bootstrap source: instances always read it at start
# so a fresh cluster can come up even when etcd is empty. The
# `config.etcd` block below makes Tarantool ALSO consult etcd as a
# source — Tarantool merges both, with present etcd keys taking
# precedence over file values. The custom community-edition shim
# (`backend/internal/config/extras.lua` + the etcd source) treats a
# missing `<prefix>/config/all` key as "no contribution" rather than
# a fatal error, so the chicken-and-egg problem of an empty store is
# resolved: file feeds the boot, the WebUI commitConfig populates
# etcd on the first save, and subsequent reloads pick up that key.

# Tarantool config-source merge: file first, then etcd. The shim
# tolerates a missing key, so an empty etcd does not block boot.
config:
  etcd:
    endpoints: ['http://etcd:2379']
    prefix: '/tarantool/webui'

credentials:
  users:
    # Replication account — used by Tarantool itself between peers.
    replicator:
      password: 'replicator-dev-password'
      roles: [replication]
    # WebUI peer account — used by the role's net.box pool to query
    # box.info on neighbours (Task 15). Privileges will be narrowed
    # to read-only specific functions once Task 15 actually wires up
    # the pool. For M0 it gets super so the role can stand on its own.
    webui_peer:
      password: 'webui-peer-dev-password'
      roles: [super]
    # Human accounts for the dev cluster. WebUI RBAC mapping
    # (viewer / operator / admin) is set in `roles_cfg.webui.rbac`
    # below; the Tarantool privileges below are only the minimum
    # `box.schema.user.auth_password` needs to validate the
    # credentials at login time.
    admin_dev:
      password: 'admin-dev-password'
      roles: [public]
    operator_dev:
      password: 'operator-dev-password'
      roles: [public]
    viewer_dev:
      password: 'viewer-dev-password'
      roles: [public]
    superuser_dev:
      password: 'superuser-dev-password'
      roles: [public]

iproto:
  advertise:
    peer:
      login: replicator

replication:
  # Built-in raft-based leader election. Failover modes (off/manual/
  # supervised) ship in Task 46.
  failover: election

groups:
  default:
    replicasets:
      rs-1:
        # In `election` failover mode the leader is chosen by the
        # built-in raft algorithm, so no explicit `leader:` is set
        # here. (Tarantool 3.x rejects `leader:` together with
        # election mode.)
        instances:
          tt-1:
            iproto:
              listen:
                - uri: '0.0.0.0:3301'
              advertise:
                peer:
                  uri: 'tt-1:3301'
          tt-2:
            iproto:
              listen:
                - uri: '0.0.0.0:3301'
              advertise:
                peer:
                  uri: 'tt-2:3301'
          tt-3:
            iproto:
              listen:
                - uri: '0.0.0.0:3301'
              advertise:
                peer:
                  uri: 'tt-3:3301'

# The webui role wakes up on every instance once roles_cfg.webui is
# applied. The role module lives at /usr/share/tarantool/webui/init.lua
# inside the image (see docker/Dockerfile.instance) so package.path
# finds it.
roles:
  - webui

roles_cfg:
  webui:
    listen: '0.0.0.0:8081'
    log_level: debug
    # Lua/SQL console — ON in the dev compose only. Production
    # manifests keep this `false`.
    console_enabled: true
    # GraphiQL explorer is convenient in dev.
    graphiql_enabled: true
    # Outbound webhooks fixture. The target is intentionally
    # unreachable (port 1) so the local smoke can observe the
    # retry → dead-letter flow without an external receiver.
    webhooks:
      - name: 'dev-loopback'
        type: 'generic'
        url: 'http://127.0.0.1:1/sink'
        events: ['audit.security', 'issue.appeared', 'config.committed', 'webhook.test']
        enabled: true
    # Where commitConfig persists YAML. The block is read by
    # `webui.config_store.client.get_client()`. Unlike the top-level
    # `config.etcd` Tarantool source, this block ONLY drives the
    # WebUI write path — no boot-time read attempt, so an empty etcd
    # is fine.
    etcd_writer:
      endpoints: ['http://etcd:2379']
      prefix: '/tarantool/webui'
