---
iproto:
  advertise:
    peer:
      login: replicator
credentials:
  users:
    webui_peer:
      password: webui-peer-dev-password
      roles:
      - super
    admin_dev:
      password: admin-dev-password
      roles:
      - public
    operator_dev:
      password: operator-dev-password
      roles:
      - public
    replicator:
      password: replicator-dev-password
      roles:
      - replication
    superuser_dev:
      password: superuser-dev-password
      roles:
      - public
    viewer_dev:
      password: viewer-dev-password
      roles:
      - public
replication:
  synchro_quorum: N/2 + 1
  failover: off
  synchro_timeout: 3
log:
  level: 5
  to: file
  file: var/log/tarantool.log
groups:
  default:
    replicasets:
      rs-1:
        instances:
          tt-3:
            iproto:
              listen:
              - uri: 0.0.0.0:3301
              advertise:
                peer:
                  uri: tt-3:3301          
          tt-2:
            iproto:
              listen:
              - uri: 0.0.0.0:3301
              advertise:
                peer:
                  uri: tt-2:3301
          tt-1:
            iproto:
              listen:
              - uri: 0.0.0.0:3301
              advertise:
                peer:
                  uri: tt-1:3301
            database:
              mode: rw
roles_cfg:
  webui:
    graphiql_enabled: true
    log_level: debug
    failover:
      keepalive_interval: 1
      agent: true
      watcher_poll_interval_sec: 1
      lease_ttl_sec: 3
      appointment_interval: 1
    listen: 0.0.0.0:8081
    console_enabled: true
    etcd_writer:
      endpoints:
      - http://etcd:2379
      prefix: /tarantool/webui
    webhooks:
    - events:
      - audit.security
      - issue.appeared
      - config.committed
      - webhook.test
      type: generic
      enabled: true
      name: dev-loopback
      url: http://127.0.0.1:1/sink
roles:
- webui
config:
  etcd:
    endpoints:
    - http://etcd:2379
    prefix: /tarantool/webui
...
