# Production cluster configuration template.
#
# Adapt this file for your environment:
#   1. Replace credentials.users.* passwords with values read from
#      Docker secrets / Vault / sealed-secrets / your KMS of choice.
#      The example values below MUST NOT survive into production.
#   2. Point config.etcd.endpoints at your real etcd cluster. In a
#      production-grade deployment etcd is highly available (≥3 nodes,
#      separate hardware), uses mTLS and has authentication enabled.
#   3. Adjust iproto.advertise.peer.params for the TLS material that
#      your network setup actually uses. The defaults below assume mTLS
#      with paths matching docker-compose.prod.example.yml.
#   4. Roles/replicasets/instances layout is identical to the dev
#      cluster (3-node single replicaset). Scale out by adding rs-2,
#      rs-3, … with their own instance triples; vshard-router /
#      vshard-storage roles plug in via roles_cfg.sharding.
#
# Cluster-wide config can be fetched from etcd instead of (or in
# addition to) this file. The hybrid approach below — bootstrap pointers
# in this file, full config in etcd — is what the WebUI uses for its
# normal two-phase commit cycle (Task 34).

config:
  etcd:
    prefix: '/tarantool/cluster-a'
    endpoints:
      - 'https://etcd-0.example.com:2379'
      - 'https://etcd-1.example.com:2379'
      - 'https://etcd-2.example.com:2379'
    # etcd RBAC user. Only `webui` role's prefix is reachable; the user
    # has read+write on `/tarantool/cluster-a/*` and nothing else.
    username: 'webui'
    password: '${ETCD_PASSWORD}'
    ssl:
      ca_file: '/etc/tarantool/tls/etcd-ca.crt'
      ssl_cert: '/etc/tarantool/tls/etcd-client.crt'
      ssl_key:  '/etc/tarantool/tls/etcd-client.key'
      # Optional TLS verify modes: 'peer' (default) or 'none' for dev.
      verify_peer: true

credentials:
  users:
    replicator:
      # In production these values are read from Docker secrets or a
      # secret manager — never committed to a git repo.
      password: '${REPLICATOR_PASSWORD}'
      roles: [replication]
    webui_peer:
      password: '${WEBUI_PEER_PASSWORD}'
      # webui_peer privileges narrow to the `read,execute` of the
      # functions the WebUI poller calls — see Task 15 for the final
      # allow-list. The `super` role is a transitional baseline.
      roles: [super]

iproto:
  advertise:
    peer:
      login: replicator
      # mTLS between peers. Each instance presents a client cert
      # signed by the cluster CA; peers verify the chain and accept
      # the connection.
      params:
        transport: 'ssl'
        ssl_ca_file:   '/etc/tarantool/tls/peer-ca.crt'
        ssl_cert_file: '/etc/tarantool/tls/peer.crt'
        ssl_key_file:  '/etc/tarantool/tls/peer.key'

replication:
  failover: election
  # bootstrap_strategy auto requires a majority of peers reachable at
  # first boot. Keep the default; the supervisor (`tt failover`) takes
  # over for the supervised mode in Task 46 when enabled.

groups:
  default:
    replicasets:
      rs-1:
        instances:
          tt-1:
            iproto:
              listen:
                - uri: '0.0.0.0:3301'
                  params:
                    transport: 'ssl'
                    ssl_cert_file: '/etc/tarantool/tls/peer.crt'
                    ssl_key_file:  '/etc/tarantool/tls/peer.key'
                    ssl_ca_file:   '/etc/tarantool/tls/peer-ca.crt'
              advertise:
                peer:
                  uri: 'tt-1:3301'
          tt-2:
            iproto:
              listen:
                - uri: '0.0.0.0:3301'
                  params:
                    transport: 'ssl'
                    ssl_cert_file: '/etc/tarantool/tls/peer.crt'
                    ssl_key_file:  '/etc/tarantool/tls/peer.key'
                    ssl_ca_file:   '/etc/tarantool/tls/peer-ca.crt'
              advertise:
                peer:
                  uri: 'tt-2:3301'
          tt-3:
            iproto:
              listen:
                - uri: '0.0.0.0:3301'
                  params:
                    transport: 'ssl'
                    ssl_cert_file: '/etc/tarantool/tls/peer.crt'
                    ssl_key_file:  '/etc/tarantool/tls/peer.key'
                    ssl_ca_file:   '/etc/tarantool/tls/peer-ca.crt'
              advertise:
                peer:
                  uri: 'tt-3:3301'

roles:
  - webui

roles_cfg:
  webui:
    listen: '0.0.0.0:8081'
    log_level: info
    # Lua/SQL eval console disabled in production. Override only on the
    # specific instance(s) you genuinely need it on, behind a break-
    # glass procedure.
    console_enabled: false
    # GraphiQL explorer disabled — every operator action should go
    # through the SPA, where it lands in the audit log.
    graphiql_enabled: false
    # CORS allowed origins. Empty list disables CORS headers entirely.
    # Set to the public origin(s) that should be allowed to call this
    # API from a browser (typically just the SPA's own origin).
    # allowed_origins:
    #   - 'https://webui.example.com'
