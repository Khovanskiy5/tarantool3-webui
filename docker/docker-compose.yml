#
# Local cluster for the Tarantool 3.7 WebUI.
#
# Topology:
#   etcd       — single-node KV; the cluster's single source of truth.
#   etcd-seed  — one-shot init container that concatenates the YAML
#                fragments under `configs/cluster/` and writes them to
#                `<prefix>/config/all` on first boot. Idempotent: skips
#                the write if the key already exists, so warm restarts
#                preserve in-place edits made through the WebUI.
#   tt-1/2/3   — three Tarantool instances. Each mounts ONLY the
#                `etcd-source.yaml` stub, which tells Tarantool where
#                to fetch the cluster config from. The mounted file
#                MUST NOT declare `groups → replicasets → instances`
#                (file source has higher priority than etcd source —
#                see `tarantool-3.7.0/src/box/lua/config/init.lua:147`).
#   haproxy    — single entry point on http://localhost:8080.
#
# Bring up:    make dev        (== docker compose -f docker/docker-compose.yml up --build -d)
# Tear down:   make dev-down   (also wipes named volumes so the next
#                              `make dev` re-seeds etcd from scratch)
name: webui

x-tarantool-common: &tarantool-common
  build:
    context: ..
    dockerfile: docker/Dockerfile.instance
  image: webui-instance:dev
  restart: unless-stopped
  # The role's box.ctl.on_shutdown hook needs ~10s to demote out of the
  # synchro queue and drain the limbo before SIGKILL. A faster stop
  # leaves uncommitted sync txns on disk that turn into "Split-Brain
  # discovered" once peers resume replication after restart.
  stop_grace_period: 10s
  environment: &tarantool-env
    TT_CONFIG: /opt/webui/etc/cluster.yaml
    WEBUI_PORT: '8081'
    WEBUI_LOG_LEVEL: debug
  volumes:
    - ./configs/etcd-source.yaml:/opt/webui/etc/cluster.yaml:ro
  healthcheck:
    test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8081/api/health']
    interval: 5s
    timeout: 3s
    retries: 6
    start_period: 30s
  networks:
    - webui-net

services:
  # ── etcd ──────────────────────────────────────────────────────────
  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    restart: unless-stopped
    environment:
      ETCD_NAME: etcd-0
      ETCD_DATA_DIR: /var/lib/etcd
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd:2379
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd:2380
      ETCD_INITIAL_CLUSTER: etcd-0=http://etcd:2380
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_INITIAL_CLUSTER_TOKEN: webui-dev
      ALLOW_NONE_AUTHENTICATION: 'yes'
    volumes:
      - etcd-data:/var/lib/etcd
    ports:
      - '2379:2379'
    healthcheck:
      test: ['CMD', 'etcdctl', '--endpoints=http://127.0.0.1:2379', 'endpoint', 'health']
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 5s
    networks:
      - webui-net

  # ── one-shot seeder ───────────────────────────────────────────────
  # Concatenates `configs/cluster/*.yaml` (lex-sorted by filename) into
  # a single YAML document and `etcdctl put`s it to the canonical key
  # `<prefix>/config/all` that `backend/webui/config_source/etcd_source.lua`
  # reads. Skips the write when the key already holds a value, so it
  # is safe to leave wired up across restarts — only `down --volumes`
  # forces a re-seed.
  etcd-seed:
    build:
      context: ..
      dockerfile: docker/Dockerfile.seed
    image: webui-etcd-seed:dev
    environment:
      ETCDCTL_API: '3'
      ETCDCTL_ENDPOINTS: http://etcd:2379
    volumes:
      - ./configs/cluster:/seed:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        existing=$$(etcdctl get /tarantool/webui/config/all --print-value-only || true)
        if [ -n "$$existing" ]; then
          echo "etcd-seed: /tarantool/webui/config/all already populated, skipping"
          exit 0
        fi
        echo "etcd-seed: concatenating /seed/*.yaml -> /tarantool/webui/config/all"
        cat /seed/*.yaml | etcdctl put /tarantool/webui/config/all
        echo "etcd-seed: done"
    depends_on:
      etcd:
        condition: service_healthy
    networks:
      - webui-net

  # ── tarantool instances ───────────────────────────────────────────
  tt-1:
    <<: *tarantool-common
    container_name: webui-tt-1
    hostname: tt-1
    environment:
      <<: *tarantool-env
      INSTANCE_NAME: tt-1
    volumes:
      - ./configs/etcd-source.yaml:/opt/webui/etc/cluster.yaml:ro
      - tt-1-data:/opt/webui/var/lib
    ports:
      - '8081:8081'
      - '3301:3301'
    depends_on:
      etcd-seed:
        condition: service_completed_successfully

  tt-2:
    <<: *tarantool-common
    container_name: webui-tt-2
    hostname: tt-2
    environment:
      <<: *tarantool-env
      INSTANCE_NAME: tt-2
    volumes:
      - ./configs/etcd-source.yaml:/opt/webui/etc/cluster.yaml:ro
      - tt-2-data:/opt/webui/var/lib
    ports:
      - '8082:8081'
      - '3302:3301'
    # All three instances start in parallel. Tarantool's replication
    # bootstrap needs a majority of peers reachable at the same moment,
    # so chaining tt-1 → tt-2 → tt-3 via depends_on deadlocks on first
    # boot.
    depends_on:
      etcd-seed:
        condition: service_completed_successfully

  tt-3:
    <<: *tarantool-common
    container_name: webui-tt-3
    hostname: tt-3
    environment:
      <<: *tarantool-env
      INSTANCE_NAME: tt-3
    volumes:
      - ./configs/etcd-source.yaml:/opt/webui/etc/cluster.yaml:ro
      - tt-3-data:/opt/webui/var/lib
    ports:
      - '8083:8081'
      - '3303:3301'
    depends_on:
      etcd-seed:
        condition: service_completed_successfully

  # ── HAProxy ───────────────────────────────────────────────────────
  haproxy:
    image: haproxy:3.3.4-alpine
    container_name: webui-haproxy
    restart: unless-stopped
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - '8080:8080'
      - '8404:8404'
    depends_on:
      tt-1:
        condition: service_healthy
      tt-2:
        condition: service_healthy
      tt-3:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', "echo 'show info' | socat stdio /var/run/haproxy.sock 2>/dev/null || true"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 2s
    networks:
      - webui-net

networks:
  webui-net:
    driver: bridge
    name: webui-net

volumes:
  etcd-data:
  tt-1-data:
  tt-2-data:
  tt-3-data:
