# graphql-codegen configuration.
#
# Run via `make gen-types` (which first calls `make dump-schema` to
# refresh src/shared/api/schema.graphql from the backend's Lua source)
# or directly via `bunx graphql-codegen --config codegen.yml`.
#
# The pipeline reads the locally dumped SDL — never the live backend —
# so CI does not need a running Tarantool to regenerate TS types.

schema: ./src/shared/api/schema.graphql

documents:
  - ./src/**/*.graphql
  - ./src/**/*.{ts,vue}

#
# `client-preset` is the modern codegen flow. It emits a tree
# under src/shared/api/generated/:
#
#   - graphql.ts  schema types (every Type/Enum/Input). Single
#                 source of truth for enums; nothing else
#                 redeclares them.
#   - gql.ts      tagged-template helper that resolves operation
#                 strings to TypedDocumentNode instances at build
#                 time.
#   - fragment-masking.ts  optional fragment-masking helpers.
#
# Each operation referenced via `gql(...)` keeps a fully typed
# TypedDocumentNode so urql's client.query / client.mutation get
# their `result.data` shape for free without re-declaring schema
# types. The urql composables we used before are replaced by
# generated `useFragment` / direct client.query calls.
#
generates:
  # Codegen output goes into __generated/ so the index.ts the
  # client-preset auto-emits (re-exports only `./gql`) cannot
  # shadow the hand-written barrel below. See
  # src/shared/api/generated.ts for the public re-exports.
  ./src/shared/api/__generated/:
    preset: client
    presetConfig:
      fragmentMasking: false
    config:
      avoidOptionals: true
      maybeValue: 'T | null'
      scalars:
        DateTime: string
        UUID: string
        JSON: 'Record<string, unknown>'
      enumsAsTypes: true
      namingConvention:
        typeNames: keep
        enumValues: keep

