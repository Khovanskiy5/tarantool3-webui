#
# Suggestions query + apply mutations.
#
# The Suggestions field returns every suggestion category in one
# round-trip — the cluster page renders all of them as a single
# banner above the topology.
#

query SuggestionsOverview {
  suggestions {
    forceApply {
      ...ForceApplyFields
    }
    restartReplication {
      ...RestartReplicationFields
    }
    refreshVshard {
      id
    }
    disableServer {
      id
    }
    refineUri {
      id
    }
    restartFailover {
      ...RestartFailoverFields
    }
    bootstrapVshard {
      id
    }
  }
}

mutation ApplyForceApply($instanceUuids: [String!]!) {
  applyForceApply(instanceUuids: $instanceUuids) {
    ...SuggestionApplyFields
  }
}

mutation ApplyRestartReplication($instanceUuids: [String!]!) {
  applyRestartReplication(instanceUuids: $instanceUuids) {
    ...SuggestionApplyFields
  }
}

# Destructive recovery for a follower stuck in split-brain. Wipes
# WAL/snap on the target and triggers Docker restart-policy re-launch
# — replication catches up fresh from healthy peers.
mutation RebootstrapInstance($alias: String!) {
  rebootstrapInstance(alias: $alias) {
    ok
    alias
    deleted_count
    message
  }
}

fragment ForceApplyFields on ForceApplySuggestion {
  id
  instanceAlias
  instanceUuid
  reason
}

fragment RestartReplicationFields on RestartReplicationSuggestion {
  id
  instanceAlias
  instanceUuid
  reason
}

fragment RestartFailoverFields on RestartFailoverSuggestion {
  id
  instanceAlias
  instanceUuid
  reason
}

fragment SuggestionApplyFields on SuggestionApplyResult {
  ok
  message
  unknown
  results {
    peer
    ok
    err
  }
}
